[project]
name = "nldate"
version = "0.1.0"
description = "A natural-language date parser for DSC 190 Assignment 06."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[[tool.mypy.overrides]]
module = "test_parse"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.ruff.format]
exclude = ["tests/**"]
